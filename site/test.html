<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>512-bit Random Walk</title>

<style>
body {
    background: #181818;
    color: #ddd;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    margin-top: 40px;
}

.card {
    background: #222;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 20px;
}

canvas {
    background: #111;
    border: 1px solid #444;
    border-radius: 8px;
}
</style>

</head>
<body>

<div class="card">
    <canvas id="walk" width="600" height="600"></canvas>
</div>

<script>

const hex =
"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef";
// Replace with your 128-character (512-bit) hex string

drawRandomWalk(hex);

function drawRandomWalk(hex)
{
    const canvas = document.getElementById("walk");
    const ctx = canvas.getContext("2d");

    const margin = 30;

    //
    // Convert hex -> bytes
    //
    const bytes = [];

    for (let i = 0; i < hex.length; i += 2)
        bytes.push(parseInt(hex.substr(i, 2), 16));

    //
    // Build path
    //
    let x = 0;
    let y = 0;

    const points = [{x, y}];

    let minX = 0;
    let maxX = 0;
    let minY = 0;
    let maxY = 0;

    for (const b of bytes)
    {
        for (let shift = 6; shift >= 0; shift -= 2)
        {
            const dir = (b >> shift) & 3;

            switch (dir)
            {
                case 0: y--; break; // up
                case 1: x++; break; // right
                case 2: y++; break; // down
                case 3: x--; break; // left
            }

            points.push({x, y});

            minX = Math.min(minX, x);
            maxX = Math.max(maxX, x);
            minY = Math.min(minY, y);
            maxY = Math.max(maxY, y);
        }
    }

    //
    // Scale to fit canvas
    //
    const width = maxX - minX;
    const height = maxY - minY;

    const scaleX = (canvas.width - margin * 2) / Math.max(width, 1);
    const scaleY = (canvas.height - margin * 2) / Math.max(height, 1);

    const scale = Math.min(scaleX, scaleY);

    //
    // Clear
    //
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    //
    // Draw walk
    //
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#4fc3f7";
    ctx.lineJoin = "round";
    ctx.lineCap = "round";

    ctx.shadowBlur = 10;
    ctx.shadowColor = "#4fc3f7";

    ctx.beginPath();

    const first = points[0];

    ctx.moveTo(
        margin + (first.x - minX) * scale,
        margin + (first.y - minY) * scale
    );

    for (let i = 1; i < points.length; i++)
    {
        const p = points[i];

        ctx.lineTo(
            margin + (p.x - minX) * scale,
            margin + (p.y - minY) * scale
        );
    }

    ctx.stroke();

    //
    // Start marker (green)
    //
    drawCircle(
        margin + (points[0].x - minX) * scale,
        margin + (points[0].y - minY) * scale,
        6,
        "#33cc66"
    );

    //
    // End marker (red)
    //
    const end = points[points.length - 1];

    drawCircle(
        margin + (end.x - minX) * scale,
        margin + (end.y - minY) * scale,
        6,
        "#ff5555"
    );

    function drawCircle(x, y, r, color)
    {
        ctx.shadowBlur = 0;

        ctx.beginPath();
        ctx.fillStyle = color;
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
    }
}

</script>

</body>
</html>
