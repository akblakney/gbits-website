<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — goobits</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="header"></div>

<main>
<div class="shell">
<h1>Visualize Random Bits</h1>

<hr>

<h2>Random Walk Visualization</h2>

<p id="walk-status">Generating random walk...</p>

<div>
<img
id="walk-plot-1d"
alt="1D random walk plot"
style="display: none; max-width: 100%;"
>
</div>

<div>
<img
id="walk-plot-2d"
alt="2D random walk plot"
style="display: none; max-width: 100%;"
>
</div>

</div>
</main>

<script src="script.js"></script>

<script>
async function loadWalk() {
  const image1d = document.getElementById("walk-plot-1d");
  const image2d = document.getElementById("walk-plot-2d");
  const status = document.getElementById("walk-status");

  try {
    const data = await apiGet("/visualize/walk");

    image1d.src = `data:image/png;base64,${data.img_1d}`;
    image1d.style.display = "block";

    image2d.src = `data:image/png;base64,${data.img_2d}`;
    image2d.style.display = "block";

    status.textContent = "";
  } catch (error) {
    console.error(error);
    status.textContent = "Failed to generate random walk.";
  }
}

loadWalk();
</script>

</body>
</html>
